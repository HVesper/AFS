beta1: 0.0
beta2: 0.999
batch_size: 1
gradient_accumulation_steps: 1
total_batch_size: 1
max_iters: 300
log_iters: 1
save_iters: 300
max_checkpoints: 0
afs_eval_interval: 0
afs_eval_num_samples: 2
afs_eval_num_frames: 243
afs_eval_seed: 12345
afs_eval_fps: 16
