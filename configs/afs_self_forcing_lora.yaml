  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 3
adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  verbose: false
  init_lora_weights: gaussian
lora_train_mode: lora
lora_ema_enabled: true
ema_start_step: 0
afs_loss_type: flow
afs_loss_frames: 240
afs_max_loss_frames: 240
afs_loss_start_frame: 3
afs_loss_step_mode: all
afs_loss_flag: -1
afs_shared_flag_per_window: true
afs_backward_per_chunk: true
